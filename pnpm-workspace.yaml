allowBuilds:
  '@google/genai': true
  protobufjs: true

# Delay adoption of freshly published versions to reduce supply-chain risk.
# Setting this explicitly also enables minimumReleaseAgeStrict, so resolution
# fails instead of silently falling back to a non-compliant version.
minimumReleaseAge: 10080 # minutes (7 days)
minimumReleaseAgeStrict: true
